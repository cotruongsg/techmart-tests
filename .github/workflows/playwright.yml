name: Playwright Tests with Cloudflare Tunnel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép nhấn nút chạy tay bất kỳ lúc nào

# 1. Cấp quyền cho GitHub Actions deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh xung đột khi deploy Pages cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn về máy chủ ảo
      - uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: tests/traditional/package-lock.json

      # 3. Cài đặt các thư viện trong thư mục tests/traditional
      - name: Install dependencies
        run: |
          cd tests/traditional
          npm ci

      # 4. Cài đặt Trình duyệt cho Playwright
      - name: Install Playwright Browsers with deps
        run: |
          cd tests/traditional
          npx playwright install --with-deps

      # 5. Thực thi Test qua Cloudflare Tunnel
      - name: Run Playwright Tests with Tunnel
        run: |
          cd tests/traditional/tests
          npm run test:all-tests:tunnel

      # 6. Upload báo cáo HTML kết quả test làm Artifact cho GitHub Pages
      - name: Upload HTML Report Artifact
        uses: actions/upload-pages-artifact@v4
        if: ${{ !cancelled() }}
        with:
          path: tests/traditional/playwright-report/

  # 2. Job tự động Deploy Báo cáo lên GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
